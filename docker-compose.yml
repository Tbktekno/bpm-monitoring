# =============================================================================
# BPM & SpO₂ Monitoring Dashboard — Docker Compose
# =============================================================================
# Production-grade orchestration for all services.
# Usage:
#   docker compose up -d                    # Start all services
#   docker compose up -d --build            # Rebuild and start
#   docker compose logs -f                  # Tail logs
#   docker compose down                     # Stop all services
# =============================================================================

services:
  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bpm-postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: bpm_monitoring
      POSTGRES_USER: bpm_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bpm_user -d bpm_monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "5432:5432"
    networks:
      - bpm-network

  # ─── Backend (Express + gRPC) ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bpm-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database — switch to PostgreSQL connection string
      DATABASE_URL: "postgresql://bpm_user:${POSTGRES_PASSWORD:?}@postgres:5432/bpm_monitoring"
      NODE_ENV: production
      PORT: 5000

      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      JWT_REMEMBER_EXPIRES_IN: ${JWT_REMEMBER_EXPIRES_IN:-7d}
      JWT_ISSUER: ${JWT_ISSUER:-bpm-monitoring}

      # gRPC
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: 50051

      # CORS — allow frontend requests through nginx
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:80}
    ports:
      - "5000:5000"
      - "50051:50051"
    networks:
      - bpm-network

  # ─── Frontend (Nginx + Vite SPA) ───────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bpm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # These are build-time args for Vite; for runtime, nginx proxies API calls.
      # Set VITE_API_BASE_URL to a relative path so it works behind the nginx proxy.
      VITE_API_BASE_URL: /api/v1
      VITE_SOCKET_URL: ""  # Empty = same origin (auto-detected by Socket.IO client)
    ports:
      - "80:80"
    networks:
      - bpm-network

# ─── Networks ────────────────────────────────────────────────────────────────
networks:
  bpm-network:
    driver: bridge
    name: bpm-network

# ─── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
    name: bpm-postgres-data

# =============================================================================
# BPM & SpO₂ Monitoring Dashboard — Nginx Configuration
# Serves the Vite SPA with API proxy, WebSocket support, and security headers
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Gzip Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        image/x-icon;

    # ─── Security Headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content Security Policy — adjust as needed for external fonts/icons
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com data:;
        img-src 'self' data: blob:;
        connect-src 'self' ws: wss:;
        frame-ancestors 'self';
        form-action 'self';
        base-uri 'self';
    " always;

    # Strip the CSP header value of extra whitespace
    # (nginx concatenates with spaces, which is fine)

    # ─── API Proxy ────────────────────────────────────────────────────────────
    # Forward REST API calls to the backend Express server
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
    }

    # ─── Socket.IO WebSocket Proxy ───────────────────────────────────────────
    # WebSocket connections and long-polling for real-time updates
    location /socket.io/ {
        proxy_pass http://backend:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for WebSocket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─── Static Assets with Long-Term Caching ────────────────────────────────
    # Vite generates content-hashed filenames in /assets/
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── SPA Fallback ─────────────────────────────────────────────────────────
    # All other routes serve index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;

        # Do not cache index.html so the latest build is always served
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}

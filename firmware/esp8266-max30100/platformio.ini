; =============================================================================
; PlatformIO Project Configuration
; BPM & SpO₂ Monitor — ESP8266 + MAX30100 + LCD I2C + Socket.IO
; =============================================================================
; Upload Monitor Baud Rate: 115200
; =============================================================================

[platformio]
default_envs = nodemcuv2

; ─── NodeMCU 1.0 (ESP-12E) ────────────────────────────────────────────────
; Base variant — works with NodeMCU v1/v2, Wemos D1 Mini, LOLIN D1
[nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dout
board_build.f_cpu = 80000000L

; ─── Wemos D1 Mini ─────────────────────────────────────────────────────────
; Compact board — same SoC, smaller footprint
[d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 80000000L

; ─── ESP-01 / ESP-01S ─────────────────────────────────────────────────────
; Minimal board — 1MB flash, fewer GPIOs
; NOTE: GPIO0 and GPIO2 are used for I2C, leaving only GPIO1 (TX) free
[esp01]
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 80000000L

; ─── Global Library Configuration ──────────────────────────────────────────
[common]
lib_deps =
    ; MAX30100 pulse oximeter sensor library
    ; https://registry.platformio.org/libraries/oxullo/MAX30100
    oxullo/MAX30100 @ ^1.1.5

    ; I2C LCD (16x2 / 20x4) via PCF8574 I2C backpack
    ; https://registry.platformio.org/libraries/marcoschwartz/LiquidCrystal_I2C
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4

    ; ArduinoJson — efficient JSON serialization/deserialization (config only)
    ; https://registry.platformio.org/libraries/bblanchon/ArduinoJson
    bblanchon/ArduinoJson @ ^7.0.3

    ; ESP8266WebServer, ESP8266HTTPClient, LittleFS — built-in di ESP8266 core
    ; Config Portal menggunakan web server sendiri (bukan WiFiManager)
    ; Storage menggunakan LittleFS (bukan EEPROM)

lib_ldf_mode = chain+
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ESPRESSIF8266
    -Wno-unknown-pragmas

; ─── Build configuration ───────────────────────────────────────────────────
; Inherit from common and apply to all envs
[env:nodemcuv2]
extends = nodemcuv2, common

[env:d1_mini]
extends = d1_mini, common

[env:esp01]
extends = esp01, common
